name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: pytest -q

  # The revision-aware MERGE from ADR 0002 against a real local Spark + Iceberg
  # session (Hadoop catalog, temp warehouse). No Docker or cloud account needed.
  spark-merge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/de-energy-streaming
            ~/.cache/pip
          key: spark-test-iceberg-1.8.1
      - run: pip install pyspark==3.5.9 pytest
      - run: python -m pytest tests/test_bronze_merge.py -q

  # Broken DAGs must fail the build before they reach the scheduler. Provider
  # versions match docker/airflow/requirements.txt via the official constraints.
  dag-tests:
    runs-on: ubuntu-latest
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-airflow-2.10.5
      - run: >-
          pip install
          apache-airflow==2.10.5
          apache-airflow-providers-apache-spark==5.0.0
          apache-airflow-providers-postgres==6.0.0
          pytest
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
      - run: python -m pytest tests/test_dags.py -q

  # The compose file and Terraform config are code too - keep them valid.
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
