[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "de-energy-streaming"
version = "0.1.0"
description = "Real-time German electricity market platform: SMARD.de -> Kafka -> Spark Structured Streaming -> Iceberg -> Postgres/Grafana."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "confluent-kafka>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "pyyaml>=6,<7",
]
analysis = [
    "matplotlib>=3.8,<4",
    "psycopg2-binary>=2.9,<3",
]

[tool.setuptools]
packages = ["producer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Spark containers and the backfill job run Python 3.10 (datetime.UTC is 3.11+).
"spark/jobs/*.py" = ["UP017"]
"producer/*.py" = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: requires the docker-compose stack to be running",
]
