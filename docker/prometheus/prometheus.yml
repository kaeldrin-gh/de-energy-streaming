# Prometheus scrape config for the local stack (observability profile).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Airflow metrics via statsd-exporter (AIRFLOW__METRICS__STATSD_* in docker-compose.yml).
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # Spark's built-in Prometheus servlet (spark/conf/metrics.properties).
  - job_name: spark-master
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: spark-worker
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark-worker:8081"]
