# Local single-worker cluster defaults.
#
# The laptop demo runs one Spark worker, and we want the long-running streaming
# job and short batch jobs (Airflow / manual spark-submit) to coexist without
# starving each other. Each application therefore gets exactly one small
# executor; concurrency comes from multiple applications, not from big
# executors. Raise these values if you give the worker more cores/memory.
spark.executor.cores 1
spark.executor.memory 768m
spark.cores.max 1
